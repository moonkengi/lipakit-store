# Netlify detects Next.js and pnpm automatically; this only pins Node.
[build]
  command = "pnpm build"
  # Netlify's Next.js support serves from here; overrides the dashboard setting.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime (OpenNext). Netlify only adds it automatically to
# projects that were Next.js when first created, so declare it explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"
